channels:
  - pytorch
  - nvidia
  - xformers
  - conda-forge
  - bioconda
dependencies:
  # Core
  - python=3.11
  - pytorch
  - torchvision
  - torchaudio
  - pytorch-cuda=12.1
  - xformers

  # Data science and visualization
  - ipykernel
  - jupyter
  - pandas
  - ipywidgets
  - numpy
  - matplotlib
  - seaborn
  - tqdm

  # Base conda dependencies
  - snakemake-minimal>=8.4.4
  - zbar
  - conda-forge::zbar-py
  - libtiff=4.5.1

  - pip
  - pip:
    # DinoV3 and FAIR
    - termcolor
    - omegaconf
    - fvcore
    - iopath
    - submitit
    - torchmetrics

    # Albumentations
    - albumentations>=2.0.4
    - simsimd      
    - stringzilla  

    # Other
    - oauthlib==3.2.2
    - pillow==10.3.0
    - pysam==0.22
    - qreader==3.13
    - requests_oauthlib==2.0.0
    - six==1.16.0
    - geopandas==1.0.1
    - scikit-learn==1.5.1
    - timm==1.0.7
    - transformers==4.49.0
    - lap>=0.5.12
    - pyzbar>=0.1.9
    - gradio

    # Local pipeline installations
    - git+https://github.com/AidanWestphal/pybioclip
    - -e .