exp_name: lca_image
species: Grevys zebra
algorithm_type: gc
data:
  name_keys:
  - occurence_id
  # - individual_id
  id_key: "uuid"
  n_filter_min: 1
  n_filter_max: 1000
  # annotation_file: ./zebra_annotations.json <-- provided by lca.py
  # embedding_file: ./zebra_embeddings.pickle <-- provided by lca.py
  # output_path: ./output <-- provided by lca.py
  # separate_viewpoints: true <-- provided by lca.py
  separate_by_fields:
  - viewpoint
  viewpoint_list:
  - left
  - right
  category_id_list:
  - 0
  representative_list:
  - true
  output_key: inter_cluster_id
algorithm:
  target_edges: 0
  initial_topk: 10
edge_weights:
  prob_human_correct: 1.0
  classifier_thresholds:
    miewid: auto(0.05)
  verifier_names: miewid no_human
logging:
  log_level: INFO
  # log_file: tmp/logs/whaleshark_kde.log <-- provided by lca.py
  update_log_file: false
  histogram_path: ""
  auto_threshold_plot_path: "/fs/ess/PAS2136/ggr_data/results/GGR2020_subset_encounter_grouping/logs/hist_inter.png"
  file_mode: w # or a for append
gc:
  verifier_name: miewid
  theta: 0.1
  validation_step: 20
  max_densify_edges: 200