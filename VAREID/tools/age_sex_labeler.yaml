# Input annotation JSON file
image_data: "/fs/ess/PAS2136/ggr_data/results/GGR2020_subset/lca/lca_annots.json"

# Path to the SQLite database used to store state and allow pausing/restarting
db_path: "cluster_labels.db"

# Path for the output annotations JSON file
out_json: "lca_annots_labeled.json"

# Gradio server port
port: 7860

# Workflow Configuration
# true: Propagate existing labels; only load clusters missing age/sex into the labeling queue.
# false: Ignore existing labels; load ALL clusters into the labeling queue from scratch.
load_unlabeled_only: true